name: Cortex Upload Test

on:
  workflow_dispatch: # Allows you to run this manually from the "Actions" tab

env:
  CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
  CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
  CORTEX_API_URL: https://c3-tac-prod.xdr.us.paloaltonetworks.com

jobs:
  cortex_scan:
    name: Cortex Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node.js Version
        run: node -v

      - name: Download cortexcli
        run: |
          set -e
          
          # Use -sS to hide progress meters but show errors, and --fail to handle HTTP errors
          crtx_resp=$(curl -sS --fail "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}")

          # Safely extract signed_url
          crtx_url=$(echo "$crtx_resp" | jq -r '.signed_url // empty')

          if [ -z "$crtx_url" ] || [ "$crtx_url" = "null" ]; then
            echo "::error::Failed to parse signed_url from response: $crtx_resp"
            exit 1
          fi

          # Download the binary silently
          curl -sS -o cortexcli "$crtx_url"
          chmod +x cortexcli
          ./cortexcli --version

      - name: Run Cortex Code Scan (customer config)
        id: scan
        shell: bash
        env:
          CORTEXCLI_HOME: ${{ runner.temp }}/cortexcli
          CORTEX_DEBUG: true
          SOURCE_DIR: "."
          EXCLUDE_PATHS: ""
        run: |
          SCAN_DIR="$(mktemp -d)"
          EXCLUDE_FILE="${SCAN_DIR}/.cortex-excludes"
          mkdir -p "${CORTEXCLI_HOME}"

          CORTEX_DEBUG_ARGS=()
          if [ "${CORTEX_DEBUG}" = "true" ]; then
            CORTEX_DEBUG_ARGS=(--log --log-level INFO --support)
            echo "Diagnostico de Cortex habilitado"
          fi

          # .github/ se excluye siempre para evitar escanear workflows/actions.
          printf '.github\n' > "$EXCLUDE_FILE"
          while IFS= read -r path; do
            # Quita espacios al inicio/fin y omite lineas vacias.
            path="${path#"${path%%[![:space:]]*}"}"
            path="${path%"${path##*[![:space:]]}"}"
            [ -z "$path" ] && continue
            [ "$path" = ".github" ] && path=".github/"
            [ "$path" = ".github/" ] && continue
            printf '%s\n' "$path" >> "$EXCLUDE_FILE"
          done <<< "${EXCLUDE_PATHS}"

          echo "Construyendo workspace temporal para escaneo..."

          # Cortex CLI 0.18.0 no soporta --exclude-path, por eso filtramos antes del scan.
          tar -C "$SOURCE_DIR" --exclude-vcs --exclude-from "$EXCLUDE_FILE" -cf - . | tar -C "$SCAN_DIR" -xf -
          echo "Directory scan: ${SCAN_DIR}"

          set +e
          ./cortexcli \
            --api-base-url "${CORTEX_API_URL}" \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            code scan \
            --directory "." \
            --repo-id "aditikisara/gha_cortexcli" \
            --branch "main" \
            --source "GITHUB_ACTIONS" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --upload-mode upload \
            --create-repo-if-missing
          SCAN_EXIT=$?
          set -e

          if [ "$SCAN_EXIT" -eq 0 ]; then
            echo "Scan completado exitosamente"
            exit 0
          fi

          ALLOW_FILE="${GITHUB_ACTION_PATH}/allow-failure.list"

          if [ -f "$ALLOW_FILE" ] && sed -e 's/#.*//' -e 's/[[:space:]]//g' "$ALLOW_FILE" | grep -Fqix "${GITHUB_REPOSITORY}"; then
            echo "::warning::Cortex fallo (exit ${SCAN_EXIT}), pero ${GITHUB_REPOSITORY} esta en allow-failure.list. Pipeline continua."
            exit 0
          fi

          echo "::error::Cortex detecto problemas (exit ${SCAN_EXIT}). Pipeline bloqueado."
          echo ""
          echo "Opciones:"
          echo "  1. Corregir los hallazgos de seguridad"
          echo "  2. Excepcion temporal: equipo de Seguridad"
          exit 1
